# =================================================================
# FINOVA AI - RENDER BLUEPRINT INFRASTRUCTURE AS CODE
# =================================================================
services:
  - type: web
    name: finova-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "false"
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

